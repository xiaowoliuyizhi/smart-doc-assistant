<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能文档助手</title>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --sidebar-w: 280px;
  --primary: #4f6ef7;
  --primary-hover: #3b5de7;
  --bg: #ffffff;
  --bg-sidebar: #f7f7f9;
  --bg-hover: #ececf1;
  --bg-chat: #ffffff;
  --bg-bubble-user: #f0f0f5;
  --bg-bubble-ai: transparent;
  --text: #1a1a2e;
  --text-secondary: #6b6b80;
  --text-muted: #9e9eae;
  --border: #e5e5ea;
  --border-light: #f0f0f5;
  --danger: #e53e3e;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "SF Mono", "Monaco", "Cascadia Code", "Consolas", monospace;
}
html, body { height: 100%; font-family: var(--font-sans); font-size: 14px; color: var(--text); background: var(--bg); overflow: hidden; }
a { color: var(--primary); text-decoration: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sidebar-header h1 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-header h1 svg { width: 28px; height: 28px; }
.sidebar-header .subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Sidebar sections */
.sidebar-section {
  padding: 12px 12px 0;
  flex-shrink: 0;
}
.sidebar-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  padding: 0 8px;
  margin-bottom: 8px;
}

/* Import area */
.import-area {
  background: var(--bg);
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.import-area:hover { border-color: var(--primary); background: #f8f9ff; }
.import-area.dragover { border-color: var(--primary); background: #eef0ff; }
.import-area svg { width: 24px; height: 24px; color: var(--primary); margin-bottom: 4px; }
.import-area p { font-size: 12px; color: var(--text-secondary); }
.import-area .or { font-size: 11px; color: var(--text-muted); margin: 4px 0; }
.import-area .paste-btn {
  color: var(--primary);
  font-size: 12px;
  font-weight: 500;
  text-decoration: underline;
}
#import-status { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; display: none; }

/* Doc list in sidebar */
.doc-list-container {
  max-height: 150px;
  overflow-y: auto;
  flex-shrink: 0;
  padding: 0 12px;
}
.doc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}
.doc-item:hover { background: var(--bg-hover); }
.doc-item .doc-icon { flex-shrink: 0; margin-right: 6px; font-size: 14px; }
.doc-item .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item .doc-meta { font-size: 10px; color: var(--text-muted); margin-left: 6px; white-space: nowrap; }
.doc-item .doc-del {
  margin-left: 4px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  visibility: hidden;
}
.doc-item:hover .doc-del { visibility: visible; }
.doc-item .doc-del:hover { color: var(--danger); background: rgba(229,62,62,0.1); }

/* Session list */
.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 12px;
  min-height: 0;
}
.session-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 2px;
  transition: background 0.15s;
  position: relative;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.active { background: #e8ecff; }
.session-item .session-info { flex: 1; min-width: 0; }
.session-item .session-title {
  font-size: 13px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-item .session-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.session-item .session-del {
  flex-shrink: 0;
  color: var(--text-muted);
  padding: 4px;
  border-radius: 4px;
  visibility: hidden;
  margin-left: 4px;
}
.session-item:hover .session-del { visibility: visible; }
.session-item .session-del:hover { color: var(--danger); background: rgba(229,62,62,0.1); }

.empty-sessions {
  padding: 20px 8px;
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
}

/* New chat button */
.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--primary);
  transition: all 0.15s;
  border: 1px solid transparent;
}
.new-chat-btn:hover {
  background: var(--bg);
  border-color: var(--primary);
}

/* Main chat area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-chat);
}
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.chat-header .current-session {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.chat-header .session-actions { display: flex; gap: 8px; }
.btn-sm {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-outline {
  border: 1px solid var(--border);
  color: var(--text-secondary);
  background: var(--bg);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger {
  border: 1px solid var(--danger);
  color: var(--danger);
  background: var(--bg);
}
.btn-danger:hover { background: rgba(229,62,62,0.06); }

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Welcome */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  text-align: center;
  padding: 40px;
  gap: 12px;
}
.welcome svg { width: 56px; height: 56px; color: var(--primary); opacity: 0.5; }
.welcome h2 { font-size: 22px; font-weight: 600; color: var(--text); }
.welcome p { font-size: 13px; max-width: 400px; line-height: 1.6; }
.welcome .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

/* Message bubbles */
.msg { display: flex; gap: 12px; max-width: 780px; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }
.msg .avatar {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
}
.msg.user .avatar { background: #4f6ef7; color: #fff; }
.msg.assistant .avatar { background: #e8ecff; color: #4f6ef7; }
.msg .bubble {
  padding: 10px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .bubble { background: var(--bg-bubble-user); border-top-right-radius: 4px; }
.msg.assistant .bubble { border-top-left-radius: 0; }

/* Sources */
.sources {
  margin-top: 8px;
  padding: 8px 12px;
  background: #f8f9fc;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-secondary);
  max-width: 780px;
  align-self: flex-start;
}
.sources-header { font-weight: 600; margin-bottom: 6px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.source-item {
  padding: 4px 0;
  font-size: 11px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-light);
}
.source-item:last-child { border-bottom: none; }
.source-item .src-score { color: var(--primary); font-weight: 500; margin-right: 6px; }
.source-item .src-origin { color: var(--text-secondary); font-weight: 600; margin-right: 6px; }

/* Input area */
.input-area {
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border-light);
  flex-shrink: 0;
}
.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 8px 8px 8px 18px;
  transition: border-color 0.2s;
}
.input-wrapper:focus-within { border-color: var(--primary); background: var(--bg); }
.input-wrapper textarea {
  flex: 1;
  border: none;
  background: transparent;
  resize: none;
  outline: none;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  min-height: 24px;
  max-height: 160px;
  padding: 6px 0;
}
.input-wrapper textarea::placeholder { color: var(--text-muted); }
.input-wrapper .send-btn {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.input-wrapper .send-btn:hover { background: var(--primary-hover); }
.input-wrapper .send-btn:disabled { background: #c4c9d4; cursor: not-allowed; }
.input-wrapper .send-btn svg { width: 18px; height: 18px; }
.input-disclaimer {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 8px;
}

/* Loading animation */
.loading-dots { display: flex; gap: 4px; padding: 4px 0; }
.loading-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  animation: bounce 1.2s infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 520px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { font-size: 18px; color: var(--text-muted); padding: 4px; border-radius: 4px; }
.modal-close:hover { background: var(--bg-hover); color: var(--text); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-body textarea {
  width: 100%;
  min-height: 200px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  color: var(--text);
}
.modal-body textarea:focus { border-color: var(--primary); }
.modal-body label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
.modal-body input[type="text"] {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  margin-bottom: 12px;
}
.modal-body input[type="text"]:focus { border-color: var(--primary); }
.modal-body .upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
}
.modal-body .upload-zone:hover { border-color: var(--primary); background: #f8f9ff; }
.modal-body .upload-zone.dragover { border-color: var(--primary); background: #eef0ff; }
.modal-body .upload-zone p { font-size: 13px; color: var(--text-secondary); }
.modal-body .upload-zone .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.btn {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { background: #c4c9d4; cursor: not-allowed; }
.btn-ghost { color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-hover); }

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  animation: toastIn 0.3s ease;
  pointer-events: none;
}
.toast.success { background: #e6ffed; color: #1a7f3f; border: 1px solid #b7ebc5; }
.toast.error { background: #ffeaea; color: #c53030; border: 1px solid #feb2b2; }
.toast.info { background: #e8ecff; color: #3b5de7; border: 1px solid #c3cffe; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d4d4dc; border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: #b0b0bc; }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        智能文档助手
      </h1>
      <p class="subtitle">基于 RAG 的文档问答系统</p>
    </div>

    <!-- 文档导入区 -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">📄 导入文档</div>
      <div class="import-area" id="importArea" onclick="openImportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
        <p>点击上传文件或粘贴文本</p>
        <p class="hint" style="font-size:10px;color:var(--text-muted)">支持 .txt / .md / .docx / .pdf</p>
      </div>
      <div id="importStatus"></div>
    </div>

    <!-- 知识库文档 -->
    <div class="sidebar-section" style="flex-shrink:0;">
      <div class="sidebar-section-title">📚 知识库 <span id="docCount" style="font-weight:400;color:var(--text-muted);margin-left:4px;"></span></div>
    </div>
    <div class="doc-list-container" id="docList">
      <div class="empty-sessions">暂无文档，请先导入</div>
    </div>

    <!-- 对话历史 -->
    <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between;">
      <div class="sidebar-section-title" style="margin-bottom:0;">💬 对话历史</div>
      <button class="new-chat-btn" onclick="newConversation()" title="新建对话">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建
      </button>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty-sessions">暂无对话</div>
    </div>
  </aside>

  <!-- ============================================================
       MAIN CHAT AREA
       ============================================================ -->
  <main class="main">
    <div class="chat-header" id="chatHeader">
      <span class="current-session" id="currentSessionTitle">新对话</span>
      <div class="session-actions" id="sessionActions" style="display:none;">
        <button class="btn-sm btn-danger" onclick="clearCurrentSession()">🗑 清除会话</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcomeScreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <h2>你好，我是智能文档助手</h2>
        <p>请先在左侧导入技术文档，然后开始提问。我的所有回答都严格基于你提供的文档内容。</p>
        <p class="hint">支持 Markdown、纯文本、Word、PDF 文档</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="questionInput"
          placeholder="输入你的问题，基于知识库文档回答..."
          rows="1"
          onkeydown="handleInputKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 12l18-9-3.5 13.5L12 15l-4.5 4.5L3 12z"/></svg>
        </button>
      </div>
      <p class="input-disclaimer">⚡ 回答严格基于知识库文档内容，不会凭空编造</p>
    </div>
  </main>
</div>

<!-- ============================================================
     IMPORT MODAL
     ============================================================ -->
<div class="modal-overlay" id="importModal" style="display:none;" onclick="closeImportModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>📄 导入文档</h3>
      <button class="modal-close" onclick="closeImportModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <p>📁 点击选择文件或拖拽到此处</p>
        <p class="hint">支持 .txt / .md / .docx / .pdf</p>
      </div>
      <input type="file" id="fileInput" accept=".txt,.md,.docx,.pdf" style="display:none;" onchange="handleFileSelect(event)">
      <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:12px;">— 或者直接粘贴文本 —</p>
      <label for="docTitle">文档标题（可选）</label>
      <input type="text" id="docTitle" placeholder="不填则使用文件名或自动生成">
      <textarea id="pasteContent" placeholder="在此粘贴文档内容（Markdown 或纯文本）..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeImportModal()">取消</button>
      <button class="btn btn-primary" id="importBtn" onclick="doImport()">导入到知识库</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
// ============================================================
// STATE
// ============================================================
const API = '/api/v1';
let currentSessionId = null;
let isStreaming = false;
let pendingFile = null;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadDocList();
  loadSessionList();
  setupDragDrop();
  document.getElementById('questionInput').addEventListener('input', updateSendBtn);
});

// ============================================================
// SIDEBAR: DOCUMENT IMPORT
// ============================================================
function openImportModal() {
  document.getElementById('importModal').style.display = 'flex';
  document.getElementById('pasteContent').value = '';
  document.getElementById('docTitle').value = '';
  document.getElementById('fileInput').value = '';
  pendingFile = null;
  document.getElementById('importBtn').disabled = false;
  document.getElementById('importBtn').textContent = '导入到知识库';
}

function closeImportModal(e) {
  if (e && e.target !== document.getElementById('importModal')) return;
  document.getElementById('importModal').style.display = 'none';
}

function setupDragDrop() {
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      pendingFile = e.dataTransfer.files[0];
      document.getElementById('docTitle').value = pendingFile.name;
      toast(`已选择文件: ${pendingFile.name}`, 'info');
    }
  });
}

function handleFileSelect(e) {
  if (e.target.files.length > 0) {
    pendingFile = e.target.files[0];
    document.getElementById('docTitle').value = pendingFile.name;
    toast(`已选择文件: ${pendingFile.name}`, 'info');
  }
}

async function doImport() {
  const pasteContent = document.getElementById('pasteContent').value.trim();
  const title = document.getElementById('docTitle').value.trim();
  const btn = document.getElementById('importBtn');

  if (!pendingFile && !pasteContent) {
    toast('请选择文件或粘贴文本内容', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '导入中...';

  try {
    let resp;
    if (pendingFile) {
      // File upload
      const formData = new FormData();
      formData.append('file', pendingFile);
      formData.append('title', title || pendingFile.name);
      resp = await fetch(`${API}/document/upload`, { method: 'POST', body: formData });
    } else {
      // Text paste
      const isMarkdown = pasteContent.match(/^#{1,6}\s/m) || pasteContent.includes('```');
      resp = await fetch(`${API}/document/import`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: pasteContent,
          title: title || '手动粘贴文档',
          content_type: isMarkdown ? 'markdown' : 'text',
        }),
      });
    }

    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '导入失败');

    toast(`导入成功！已切分为 ${data.chunk_count} 个片段`, 'success');
    closeImportModal();
    loadDocList();
  } catch (err) {
    toast(`导入失败: ${err.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '导入到知识库';
  }
}

// ============================================================
// SIDEBAR: DOC LIST
// ============================================================
async function loadDocList() {
  try {
    const resp = await fetch(`${API}/document/list`);
    const data = await resp.json();
    const container = document.getElementById('docList');
    const countEl = document.getElementById('docCount');

    countEl.textContent = data.total > 0 ? `(${data.total})` : '';

    if (data.total === 0) {
      container.innerHTML = '<div class="empty-sessions">暂无文档，请先导入</div>';
      return;
    }

    container.innerHTML = data.documents.map(d => `
      <div class="doc-item">
        <span class="doc-icon">📄</span>
        <span class="doc-name" title="${esc(d.title)}">${esc(d.title || d.doc_id)}</span>
        <span class="doc-meta">${d.total_chars}字</span>
        <button class="doc-del" onclick="event.stopPropagation();deleteDoc('${d.doc_id}')" title="删除文档">×</button>
      </div>
    `).join('');
  } catch (err) {
    console.error('Failed to load doc list:', err);
  }
}

async function deleteDoc(docId) {
  if (!confirm(`确定要删除文档「${docId}」及其所有切片吗？`)) return;
  try {
    const resp = await fetch(`${API}/document/${docId}`, { method: 'DELETE' });
    if (resp.ok) {
      toast('文档已删除', 'success');
      loadDocList();
    }
  } catch (err) {
    toast('删除失败', 'error');
  }
}

// ============================================================
// SIDEBAR: SESSION LIST
// ============================================================
async function loadSessionList() {
  try {
    const resp = await fetch(`${API}/chat/sessions`);
    const data = await resp.json();
    const container = document.getElementById('sessionList');

    if (data.total === 0) {
      container.innerHTML = '<div class="empty-sessions">暂无对话</div>';
      return;
    }

    container.innerHTML = data.sessions.map(s => `
      <div class="session-item${s.session_id === currentSessionId ? ' active' : ''}" onclick="switchSession('${s.session_id}')">
        <div class="session-info">
          <div class="session-title">${esc(s.last_message || s.session_id)}</div>
          <div class="session-date">${formatTime(s.updated_at)} · ${s.message_count} 条消息</div>
        </div>
        <button class="session-del" onclick="event.stopPropagation();deleteSession('${s.session_id}')" title="删除会话">🗑</button>
      </div>
    `).join('');
  } catch (err) {
    console.error('Failed to load sessions:', err);
  }
}

async function deleteSession(sid) {
  if (!confirm(`确定要清除会话「${sid}」吗？`)) return;
  try {
    await fetch(`${API}/chat/session/${sid}`, { method: 'DELETE' });
    if (sid === currentSessionId) {
      currentSessionId = null;
      updateHeader();
      showWelcome();
    }
    loadSessionList();
    toast('会话已清除', 'success');
  } catch (err) {
    toast('清除失败', 'error');
  }
}

// ============================================================
// SESSION SWITCHING
// ============================================================
async function switchSession(sid) {
  currentSessionId = sid;
  updateHeader();
  loadSessionList();

  // Load history
  try {
    const resp = await fetch(`${API}/chat/history/${sid}`);
    const data = await resp.json();
    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('messages').classList.remove('messages');
    document.getElementById('messages').classList.add('messages');
    const messagesEl = document.getElementById('messages');
    // Remove existing message nodes except welcome
    messagesEl.querySelectorAll('.msg,.sources').forEach(el => el.remove());
    document.getElementById('welcomeScreen').style.display = 'none';

    data.messages.forEach(m => {
      const messageEl = appendMessage(m.role, m.content);
      if (m.role === 'assistant' && m.retrieved_chunks?.length) {
        appendSources(messageEl, m.retrieved_chunks);
      }
    });
    scrollToBottom();
  } catch (err) {
    showWelcome();
  }
}

function updateHeader() {
  const titleEl = document.getElementById('currentSessionTitle');
  const actionsEl = document.getElementById('sessionActions');
  if (currentSessionId) {
    titleEl.textContent = '对话 ' + currentSessionId.substring(0, 8) + '...';
    actionsEl.style.display = 'flex';
  } else {
    titleEl.textContent = '新对话';
    actionsEl.style.display = 'none';
  }
}

function showWelcome() {
  const messagesEl = document.getElementById('messages');
  messagesEl.querySelectorAll('.msg,.sources').forEach(el => el.remove());
  document.getElementById('welcomeScreen').style.display = 'flex';
}

// ============================================================
// CHAT
// ============================================================
function updateSendBtn() {
  const input = document.getElementById('questionInput');
  document.getElementById('sendBtn').disabled = !input.value.trim() || isStreaming;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question || isStreaming) return;

  // Clear input
  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();

  // Generate session ID if needed
  if (!currentSessionId) {
    currentSessionId = 'session-' + Date.now().toString(36);
    updateHeader();
  }

  // Hide welcome
  const welcome = document.getElementById('welcomeScreen');
  if (welcome) welcome.style.display = 'none';

  // Append user message
  appendMessage('user', question);
  scrollToBottom();

  // Create assistant message placeholder
  const aiMsgEl = appendMessage('assistant', '', true);
  const bubble = aiMsgEl.querySelector('.bubble');
  let fullAnswer = '';

  isStreaming = true;
  updateSendBtn();

  try {
    const resp = await fetch(`${API}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: currentSessionId,
        question: question,
        stream: true,
      }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || '请求失败');
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.substring(6).trim();
          if (!data || data === '[DONE]') continue;
          try {
            const chunk = JSON.parse(data);
            if (chunk.retrieved_chunks && chunk.retrieved_chunks.length > 0) {
              appendSources(aiMsgEl, chunk.retrieved_chunks);
            }
            if (chunk.delta) {
              fullAnswer += chunk.delta;
              bubble.innerHTML = renderMarkdown(fullAnswer);
              scrollToBottom();
            }
          } catch (e) {
            // Skip malformed JSON
          }
        }
      }
    }
  } catch (err) {
    bubble.innerHTML = `<span style="color:var(--danger)">出错了: ${esc(err.message)}</span>`;
  } finally {
    isStreaming = false;
    updateSendBtn();
    // If no answer came through, show something
    if (!fullAnswer && bubble.innerHTML.includes('loading-dots')) {
      bubble.innerHTML = '暂时无法回答，请检查知识库是否有相关文档。';
    }
    loadSessionList();
  }
}

function appendMessage(role, content, isStreamingPlaceholder = false) {
  const messagesEl = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatarText = role === 'user' ? '我' : 'AI';
  div.innerHTML = `
    <div class="avatar">${avatarText}</div>
    <div class="bubble">${isStreamingPlaceholder ? '<div class="loading-dots"><span></span><span></span><span></span></div>' : renderMarkdown(content)}</div>
  `;
  messagesEl.appendChild(div);
  return div;
}

function appendSources(messageEl, sources) {
  const nextEl = messageEl.nextElementSibling;
  if (nextEl?.classList.contains('sources')) return;

  const srcEl = document.createElement('div');
  srcEl.className = 'sources';
  srcEl.innerHTML = `
    <div class="sources-header">📎 参考资料</div>
    ${sources.map(s => `
      <div class="source-item">
        <span class="src-score">${s.retrieval_mode === 'hybrid' ? `综合排名 #${s.rank}` : `语义相似度 ${(s.score * 100).toFixed(0)}%`}</span>
        <span class="src-origin">${esc(s.doc_title || `文档 ${s.doc_id}`)} · 片段 ${s.chunk_index}</span>
        ${esc(s.content.substring(0, 120))}${s.content.length > 120 ? '...' : ''}
      </div>
    `).join('')}
  `;
  messageEl.after(srcEl);
}

function scrollToBottom() {
  const messagesEl = document.getElementById('messages');
  setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 10);
}

// ============================================================
// SESSION ACTIONS
// ============================================================
function newConversation() {
  currentSessionId = null;
  updateHeader();
  showWelcome();
  loadSessionList();
}

async function clearCurrentSession() {
  if (!currentSessionId) return;
  if (!confirm('确定要清除当前会话的所有记录吗？')) return;
  try {
    await fetch(`${API}/chat/session/${currentSessionId}`, { method: 'DELETE' });
    currentSessionId = null;
    updateHeader();
    showWelcome();
    loadSessionList();
    toast('会话已清除', 'success');
  } catch (err) {
    toast('清除失败', 'error');
  }
}

// ============================================================
// UTILS
// ============================================================
function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = esc(text);
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code style="background:#f2f2f5;padding:1px 5px;border-radius:4px;font-size:13px;">$1</code>');
  // Code blocks
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre style="background:#f7f7f9;padding:12px;border-radius:8px;overflow-x:auto;font-size:12px;margin:8px 0;"><code>$2</code></pre>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h4 style="font-size:15px;margin:8px 0 4px;">$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="font-size:16px;margin:10px 0 4px;">$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2 style="font-size:18px;margin:12px 0 6px;">$1</h2>');
  // Lists
  html = html.replace(/^- (.+)$/gm, '<li style="margin-left:16px;">$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin-left:16px;">$1</li>');
  // Newlines
  html = html.replace(/\n\n/g, '<br><br>');
  return html;
}

function toast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2500);
}
